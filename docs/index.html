<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seema · AI Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#14112b;--muted:#5d5873;--line:#e7e4f0;--shadow:0 10px 28px rgba(20,17,43,.10);--accent:#4f46e5}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--card:#232326;--ink:#f3f2f8;--muted:#a9a6b8;--line:#34333a;--shadow:0 10px 28px rgba(0,0,0,.45);--accent:#8b84ff}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);overflow:hidden}
.wrap{position:relative;padding:14px 0 18px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:22px;width:max-content;animation:slide 70s linear infinite}
.wrap:hover .track{animation-play-state:paused}
@keyframes slide{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.card{width:300px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(79,70,229,.25)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-bottom:1px solid var(--line)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.chip{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;color:#fff}
h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
p{font-size:13.5px;line-height:1.45;color:var(--muted);flex:1}
.cta{font-size:13px;font-weight:600;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.track{animation:none}html,body{overflow-x:auto}}
</style>
</head>
<body>
<div class="wrap"><div class="track" id="track"></div></div>
<script>
const CDN="https://cdn.jsdelivr.net/gh/Seema777111-git/Saki-AI-Portfolio@d57426d/";
const N="https://www.notion.so/";
const P=[
 ["Voice AI Agent","Voice and automation","#2563eb","Voice-AI-Agent","40d35114c6758124bd5edc3d7a80de72","Customers talk to it on Telegram: live prices, GST maths and emailed quotes, in text and voice."],
 ["BizRadar AI","Market research","#db2777","BizRadar-AI","40d35114c675819baffcc875e483c432","Enter an idea and a city. Five AI agents return a sourced market report in about a minute."],
 ["Smart Cater AI","Sales automation","#d97706","SmartCater-AI","40d35114c675815480fffd5b2a3debda","From chat enquiry to approved quotation PDF in the client's inbox, on autopilot."],
 ["DataSherpa AI","AI data analysis","#7c3aed","DataSherpa-AI","40d35114c675810bbb1cde9163ce8d71","Upload sales data, ask in plain English and approve a report where every number is verified."],
 ["SlotEase","Business software","#ea580c","SlotEase","40d35114c6758144a9c4e10f27fc1beb","Online booking for salons, clinics and physio centres, with no double bookings."],
 ["TN Farmer Scheme AI","RAG and search","#16a34a","TN-Farmer-Scheme-AI","40d35114c67581b6b247c0c4b5573d78","Farmers ask in English, Tamil or Tanglish and get answers from official scheme data."],
 ["Hybrid RAG","RAG and search","#0d9488","Hybrid-RAG","40d35114c675815aab7bd09f4ebff5f8","Document Q&A with vector search and a knowledge graph. Every answer shows its evidence."]
];
const card=([t,c,col,dir,id,d])=>`<a class="card" href="${N+id}" target="_blank" rel="noopener">
<img src="${CDN+dir}/images/thumbnail.jpg" alt="${t}" loading="eager">
<div class="body"><span class="chip" style="background:${col}">${c}</span><h3>${t}</h3><p>${d}</p><span class="cta">View case study →</span></div></a>`;
const html=P.map(card).join("");
document.getElementById("track").innerHTML=html+html;
</script>
</body>
</html>
